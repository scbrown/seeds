[package]
name = "seeds"
version = "0.0.1"
edition = "2021"
description = "An experiment: beads-shaped work items stored as facts in a quipu knowledge graph"
license = "MIT"
repository = "https://github.com/scbrown/seeds"
rust-version = "1.85"
# An experiment, not a distribution. Refuse an accidental `cargo publish`.
publish = false

[[bin]]
name = "seeds"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
