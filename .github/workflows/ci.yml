name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The core without the CLI or SHACL (the feature set the wasm build uses),
      # natively: exercises the non-SHACL validation path.
      - run: cargo test --no-default-features
      - name: Publishing guard refuses what it must
        run: bash scripts/ci/crates-publish-guard.sh --selftest
      - name: Prove the built binary round-trips create -> dep add -> ready -> close
        run: |
          set -euo pipefail
          cargo build
          SD="$PWD/target/debug/sd"
          "$SD" --version
          work=$(mktemp -d) && cd "$work"
          export SEEDS_ACTOR=ci HOME="$work" XDG_CONFIG_HOME="$work/.config"
          a=$("$SD" create "Write the parser" -p 1 --silent)
          b=$("$SD" create "Design the grammar" --silent)
          "$SD" dep add "$a" "$b"
          test "$("$SD" ready --json | jq -r '[.[].id] | join(",")')" = "$b"
          "$SD" close "$b" --reason "ci round trip"
          test "$("$SD" ready --json | jq -r '[.[].id] | join(",")')" = "$a"
          test -f .seeds/seeds.db

  # The core on wasm32 (seeds must compile to wasm). Mirrors
  # `just wasm` and `just wasm-test`: the library builds and lints for
  # wasm32-unknown-unknown with no default features, the create -> dep ->
  # ready demo links, and tests/core.rs runs under node.
  wasm:
    name: Wasm (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-bindgen-test-runner at the locked wasm-bindgen version
        run: |
          set -euo pipefail
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          if ! command -v wasm-bindgen-test-runner >/dev/null || ! wasm-bindgen --version | grep -qF "$V"; then
            cargo install wasm-bindgen-cli --version "$V" --locked --force
          fi
      - name: Build the core for wasm32
        run: cargo build --target wasm32-unknown-unknown --lib --no-default-features --release
      - name: Lint the core for wasm32
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --all-targets -- -D warnings
      - name: Link the demo and report its size
        run: |
          set -euo pipefail
          cargo build --target wasm32-unknown-unknown --no-default-features --release --example ready_demo
          f=target/wasm32-unknown-unknown/release/examples/ready_demo.wasm
          echo "ready_demo.wasm: $(stat -c %s "$f") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Core tests on wasm32 (node)
        run: cargo test --target wasm32-unknown-unknown --no-default-features --test core

  # Mode 2 and mode 3 against a real quipu server: the released
  # quipu-server binary, pinned by version AND sha256, drives tests/modes.rs
  # and the remote backend's own unit tests (src/native/remote.rs).
  # Without SEEDS_TEST_QUIPU_SERVER those tests skip (and say so), so this job
  # is the only place they are proven.
  remote:
    name: Remote (quipu-server)
    runs-on: ubuntu-latest
    # The newest published release, 0.11.0: the version the production server
    # reports. Its build is 0.11.0 plus later main commits not yet released
    # (among them /update reporting counts), so tests must not depend on
    # what /update answers; they verify by reading back.
    env:
      QUIPU_TAG: quipu-ai-v0.11.0
      QUIPU_SHA256: 328eacceb9f9c0e8fcb03c0ef2a4af53ca390b65bc02ca25550fce72f98806c7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch and verify quipu-server
        run: |
          set -euo pipefail
          a="quipu-${QUIPU_TAG}-x86_64-unknown-linux-gnu"
          curl -fsSL -o "$a.tar.gz" "https://github.com/scbrown/quipu/releases/download/${QUIPU_TAG}/$a.tar.gz"
          echo "${QUIPU_SHA256}  $a.tar.gz" | sha256sum -c -
          tar xzf "$a.tar.gz"
          echo "SEEDS_TEST_QUIPU_SERVER=$PWD/$a/quipu-server" >> "$GITHUB_ENV"
      - name: Storage modes against the server
        run: |
          set -euo pipefail
          cargo test --test modes -- --nocapture 2>&1 | tee modes.log
      - name: Remote backend unit tests against the server
        run: |
          set -euo pipefail
          cargo test --lib native::remote::tests -- --nocapture 2>&1 | tee remote-lib.log
      - name: Prove the remote tests ran rather than skipped
        run: |
          set -euo pipefail
          if grep -q SKIPPED modes.log remote-lib.log; then echo "remote tests skipped" >&2; exit 1; fi
          grep -q 'test remote_mode_reads_and_writes_a_quipu_server ... ok' modes.log
          grep -q 'test native::remote::tests::the_batched_graph_read_equals_the_whole_graph_scan ... ok' remote-lib.log

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - run: mdbook build docs/book
