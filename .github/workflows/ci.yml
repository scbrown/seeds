name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Publishing guard refuses what it must
        run: bash scripts/ci/crates-publish-guard.sh --selftest
      - name: Prove the built binary starts and refuses with its not-yet code
        run: |
          set -euo pipefail
          cargo build
          ./target/debug/sd --version
          rc=0
          ./target/debug/sd ready --json 2> ready.err || rc=$?
          test "$rc" -eq 13 || { echo "expected exit 13, got $rc" >&2; exit 1; }
          grep -qx 'seeds: ready not yet implemented (see docs/book)' ready.err

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - run: mdbook build docs/book
